<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bibliothèque de la fédération FSGGB : documents, ressources et textes scouts.">
  <meta name="theme-color" content="#000761">
  <title>Bibliothèque · FSGGB</title>
  <link rel="icon" type="image/svg+xml" href="assets/bibliotheque.svg">
  <link rel="stylesheet" href="bibliotheque.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M9.5 17v-3.5h1.3a1.2 1.2 0 0 1 0 2.4H9.5M14 17v-3.5h1M14 15.2h.9"/></symbol>
  <symbol id="i-document" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></symbol>
  <symbol id="i-tableur" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
  <symbol id="i-diaporama" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 17v3M8 20h8"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2v8l-4-2"/></symbol>
  <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 1 1-3-3 3 3 0 0 1 3 3zM19 16a3 3 0 1 1-3-3 3 3 0 0 1 3 3z"/></symbol>
  <symbol id="i-texte" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 12h6M10 15h6M10 18h4"/></symbol>
  <symbol id="i-fichier" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
</defs></svg>

<header class="bar">
  <a class="brand" href="/ScoutHub/" title="Retour à ScoutHub"><img src="assets/bibliotheque.svg" alt="" width="30" height="30"><b>Bibliothèque</b><span class="sub">Documents de la fédération</span></a>
  <div class="bar-right"><a class="bar-link" href="/ScoutHub/">ScoutHub</a><a class="bar-link" href="/ScoutHub/ChatGDB/">ChatGDB</a></div>
</header>

<main class="shell">
  <section id="gate" class="gate" hidden>
    <svg class="ic big"><use href="#i-lock"/></svg>
    <h1>Connexion requise</h1>
    <p>La bibliothèque est réservée aux membres de la fédération. Connectez-vous avec votre compte ScoutHub (Google ou adresse e-mail).</p>
    <a class="btn primary" id="gate-login" href="/ScoutHub/index.html?connexion=1&next=ScoutBibliotheque/">Se connecter</a>
  </section>

  <section id="lib" hidden>
    <div class="top">
      <div><p class="label">Ressources</p><h1>Bibliothèque</h1></div>
      <div class="tools">
        <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Rechercher un titre ou un contenu…" autocomplete="off" aria-label="Rechercher dans la bibliothèque"></label>
        <div class="seg" role="group" aria-label="Affichage"><button id="v-grid" type="button" aria-pressed="true" title="Vignettes"><svg class="ic"><use href="#i-grid"/></svg></button><button id="v-list" type="button" aria-pressed="false" title="Liste"><svg class="ic"><use href="#i-list"/></svg></button></div>
      </div>
    </div>
    <nav class="crumbs" id="crumbs" aria-label="Chemin"></nav>
    <p class="status" id="status" role="status"></p>
    <div id="folders" class="folders"></div>
    <div id="files" class="files grid"></div>
  </section>
</main>

<dialog id="viewer" class="viewer">
  <header><b id="v-title"></b><span class="grow"></span><a class="btn small" id="v-ask" target="_blank" rel="noopener"><svg class="ic"><use href="#i-spark"/></svg> Poser une question</a><button class="btn small" id="v-dl" type="button"><svg class="ic"><use href="#i-download"/></svg> Télécharger</button><button class="icon" id="v-close" type="button" aria-label="Fermer"><svg class="ic"><use href="#i-close"/></svg></button></header>
  <div id="v-body" class="v-body"></div>
</dialog>
<footer class="foot">Bibliothèque · FSGGB · <a href="https://github.com/fsggb/ScoutBibliotheque">Code source</a></footer>
<script src="/ScoutHub/config.js"></script>
<script src="/ScoutHub/common.js"></script>
<script src="config.js"></script>
<script src="/ScoutHub/scouthub-client.js" data-app="Bibliothèque"></script>
<script src="bibliotheque.js"></script>
</body>
</html>
